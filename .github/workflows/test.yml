name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Hermes ${{ matrix.hermes }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "release" is Hermes's latest GitHub release (the plugin's behaviour on versions that
        # predate plugin start directories and Bot Desktop hosting); "main" has both.
        hermes: [release, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Get Hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global core.longpaths true
          if [ "${{ matrix.hermes }}" = "release" ]; then
            ref=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          else
            ref=main
          fi
          echo "Hermes ref: $ref"
          git clone --depth 1 --branch "$ref" https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" log -1 --format='Hermes %H'
      - name: Install Hermes, the plugin and its tests
        shell: bash
        run: |
          # Hermes holds a few packages with [tool.uv] override-dependencies that pip cannot see, so
          # pip alone cannot install it. Install with uv and apply the same overrides.
          python -m pip install --upgrade pip uv
          python - "$RUNNER_TEMP/hermes-agent/pyproject.toml" "$RUNNER_TEMP/overrides.txt" <<'PY'
          import sys, tomllib
          doc = tomllib.load(open(sys.argv[1], "rb"))
          open(sys.argv[2], "w").write("\n".join(doc.get("tool", {}).get("uv", {}).get("override-dependencies", [])) + "\n")
          PY
          uv pip install --system --override "$RUNNER_TEMP/overrides.txt" -e "$RUNNER_TEMP/hermes-agent" -e ".[test]"
      - name: Show which PowerShell and bash the Windows tests will use
        shell: bash
        run: |
          command -v pwsh || true
          command -v powershell || true
          command -v bash
      - name: Run the tests
        run: python -m pytest -q -rs

  hermes-lock:
    # Hermes admits a plugin by locking its uv workspace for every platform it supports (Android
    # included) with the uv version it pins. Reproduce that lock so an unresolvable dependency fails
    # here, not when a user enables the plugin.
    name: Hermes admission lock (Hermes ${{ matrix.hermes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes: [release, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Get Hermes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.hermes }}" = "release" ]; then
            ref=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          else
            ref=main
          fi
          echo "Hermes ref: $ref"
          git clone --depth 1 --branch "$ref" https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
      - name: Run Hermes's plugin lock (uv lock, android split, Python 3.14)
        run: python scripts/check_hermes_lock.py "$RUNNER_TEMP/hermes-agent" --python 3.14
