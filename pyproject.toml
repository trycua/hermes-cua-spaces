[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-cua-spaces"
version = "0.4.0"
description = "Hermes Agent terminal backend that runs commands inside a Cua Space (Linux, macOS or Windows)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cua", email = "hello@trycua.com" }]
requires-python = ">=3.11"
dependencies = ["cua>=0.5.0,<0.8; sys_platform != 'android'"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/trycua/hermes-cua-spaces"

[tool.hatch.build.targets.wheel]
packages = ["hermes_cua_spaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
